baseURL = 'https://beehen.de'
defaultContentLanguage = 'de-de'
locale = 'de-DE'
timeZone = "Europe/Berlin"
enableEmoji = true
enableRobotsTXT = true
pluralizeListTitles = false
summaryLength = 70
# Rohvideos (scripts/vidpre.py: <name>.raw.<ext>) sind Quelldateien, keine
# Web-Assets — Hugo soll sie ignorieren (sonst landen sie im public/).
ignoreFiles = ['\.raw\.[^.]+$']

title = 'Karin und Steff unterwegs'
# Nur im RSS-Feed (<copyright>) sichtbar, dort ist reiner Text gefragt; der
# Lizenzlink im Footer steht in layouts/_partials/footer.html.
copyright = 'CC BY-NC 4.0, https://creativecommons.org/licenses/by-nc/4.0/'

theme = 'bienensteff'

# Ohne diesen Block baut Hugo zusaetzlich eine leere Seite /categories/.
# Tags sind die der Artikel, Hashtags die der Notizen (content/notizen/);
# beide bleiben getrennt.
[taxonomies]
tag = 'tags'
hashtag = 'hashtags'

[params]
description = 'Eine kleine Erkundung der Welt'
# Zielformat, in das der fig-Shortcode Bilder konvertiert
imageFormat = 'webp'
# "i" auf fig- und Galerie-Bildern, das eine Box mit Aufnahmedatum, Kamera,
# Aufnahmeort (verlinkt zu OpenStreetMap) und Link zum Original oeffnet.
# Der Ort braucht den GPS-Ausschluss aus [imaging.meta].fields entfernt
# (siehe unten).
imageInfo = true
# Dunkles Farbschema, wenn das System des Besuchers auf dunkel steht. Es gibt
# keinen Schalter auf der Seite.
darkMode = true
# Kontaktblock im Footer (layouts/_partials/footer.html), Markdown.
contact = """Stefan Tatschner

[stefan.tatschner@mailbox.org](mailto:stefan.tatschner@mailbox.org)
"""


[menus]
[[menus.main]]
name = 'Notizen'
pageRef = '/notizen'
weight = 5

[[menus.main]]
name = 'Über uns'
pageRef = '/über-uns'
weight = 10

[[menus.main]]
name = '#Tags'
pageRef = '/tags'
weight = 20

# Footer: je ein Menue pro Spalte, siehe layouts/_partials/footer.html.
[[menus.footerExternalLinks]]
  name = 'bienensteff.de'
  url = 'https://bienensteff.de'
  weight = 10

[[menus.footerExternalLinks]]
  name = 'sensing-the-world.de'
  url = 'https://sensing-the-world.de/'
  weight = 20

[[menus.footerLegal]]
  name = 'Impressum'
  pageRef = '/impressum'
  weight = 10

[[menus.footerLegal]]
  name = 'Datenschutz'
  pageRef = '/datenschutz'
  weight = 20

[privacy]
  [privacy.youtube]
    disable = false
    privacyEnhanced = true

[imaging]
  resampleFilter = "Lanczos"

  # Global nur fuer Hugo < 0.163 (z.B. das Fedora-Paket), das die Werte pro
  # Format unten noch nicht kennt und sonst mit 75 baut. Neuere Versionen
  # melden den Schluessel als veraltet (nur auf Log-Level info) und nehmen
  # die Werte pro Format. Kann weg, sobald lokal kein altes Hugo mehr laeuft.
  quality = 90

  # Wie bienensteff.de: verlustbehaftete Qualitaet fuer verkleinerte Bilder
  # (WebP ueber die fig-/image-Partials). Bei 80 waren Artefakte in weichen
  # Verlaeufen sichtbar, daher 90.
  # Pro Format gesetzt, das globale imaging.quality ist seit Hugo 0.163
  # deprecated.
  [imaging.webp]
    quality = 90

  [imaging.jpeg]
    quality = 90

  [imaging.meta]
    # Hugo-Default, aber ohne den GPS-Ausschluss: .Meta.Lat/.Long fuer den
    # Aufnahmeort in der Bild-Info (imageInfo). Aendern invalidiert den
    # Bild-Cache.
    # Zusaetzlich ohne ComponentsConfiguration: das Feld ist in den
    # Panorama-Bildern (*_PANO.jpg) kaputt und erzeugt sonst je Bild ein WARN.
    fields = ['! *{Exif,Exposure[MPB],Contrast,Resolution,Sharp,JPEG,Metering,Sensing,Saturation,ColorSpace,Flash,WhiteBalance,Components}*']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.typographer]
        apostrophe = '&rsquo;'
        disable = false
        ellipsis = '&hellip;'
        emDash = '&mdash;'
        enDash = '&ndash;'
        leftAngleQuote = '&laquo;'
        leftDoubleQuote = '„'
        leftSingleQuote = '‚'
        rightAngleQuote = '&raquo;'
        rightDoubleQuote = '”'
        rightSingleQuote = '‘' 
