baseURL = 'https://beehen.de'
defaultContentLanguage = 'de-de'
locale = 'de-DE'
timeZone = "Europe/Berlin"
enableEmoji = true
enableRobotsTXT = true
pluralizeListTitles = false
summaryLength = 70
# Rohvideos (scripts/vidpre.py: <name>.raw.<ext>) sind Quelldateien, keine
# Web-Assets — Hugo soll sie ignorieren (sonst landen sie im public/).
ignoreFiles = ['\.raw\.[^.]+$']

title = 'Karin und Steff unterwegs'
# Nur im RSS-Feed (<copyright>) sichtbar, dort ist reiner Text gefragt; der
# Lizenzlink im Footer steht in layouts/_partials/footer.html.
copyright = 'CC BY-NC 4.0, https://creativecommons.org/licenses/by-nc/4.0/'

theme = 'bienensteff'

[params]
description = 'Eine kleine Erkundung der Welt'
# Zielformat, in das der fig-Shortcode Bilder konvertiert
imageFormat = 'webp'
# GPS-Koordinaten (Exif/XMP) unter fig-Bildern anzeigen, verlinkt zu OpenStreetMap.
# Braucht den GPS-Ausschluss aus [imaging.meta].fields entfernt (siehe unten).
imageGeotags = true


[menus]
[[menus.main]]
name = 'Über uns'
pageRef = '/über-uns'
weight = 10

[[menus.main]]
name = '#tags'
pageRef = '/tags'
weight = 20

[[menus.footer]]
  name = 'Impressum'
  pageRef = '/impressum'
  weight = 10

[[menus.footer]]
  name = 'bienensteff.de'
  url = 'https://bienensteff.de'
  weight = 20

[privacy]
  [privacy.youtube]
    disable = false
    privacyEnhanced = true

[imaging]
  resampleFilter = "Lanczos"

  # Wie bienensteff.de: verlustbehaftete Qualitaet fuer verkleinerte Bilder
  # (WebP ueber die fig-/image-Partials). Um 80 ist optisch nicht von
  # hoeheren Werten zu unterscheiden, die Dateien sind aber deutlich kleiner.
  # Pro Format gesetzt, das globale imaging.quality ist seit Hugo 0.163
  # deprecated.
  [imaging.webp]
    quality = 80

  [imaging.jpeg]
    quality = 80

  [imaging.meta]
    # Hugo-Default, aber ohne den GPS-Ausschluss: .Meta.Lat/.Long fuer den
    # fig-Geotag (imageGeotags). Aendern invalidiert den Bild-Cache.
    # Zusaetzlich ohne ComponentsConfiguration: das Feld ist in den
    # Panorama-Bildern (*_PANO.jpg) kaputt und erzeugt sonst je Bild ein WARN.
    fields = ['! *{Exif,Exposure[MPB],Contrast,Resolution,Sharp,JPEG,Metering,Sensing,Saturation,ColorSpace,Flash,WhiteBalance,Components}*']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.typographer]
        apostrophe = '&rsquo;'
        disable = false
        ellipsis = '&hellip;'
        emDash = '&mdash;'
        enDash = '&ndash;'
        leftAngleQuote = '&laquo;'
        leftDoubleQuote = '„'
        leftSingleQuote = '‚'
        rightAngleQuote = '&raquo;'
        rightDoubleQuote = '”'
        rightSingleQuote = '‘' 
