baseURL = 'https://beehen.de'
defaultContentLanguage = 'de-de'
locale = 'de-DE'
timeZone = "Europe/Berlin"
enableEmoji = true
enableRobotsTXT = true
pluralizelisttitles = "false"
summaryLength = 70

title = 'Karin und Steff unterwegs'
copyright = '<p xmlns:cc="http://creativecommons.org/ns#" >This work is licensed under <a href="http://creativecommons.org/licenses/by-nc/4.0/?ref=chooser-v1" target="_blank" rel="license noopener noreferrer" style="display:inline-block;">CC BY-NC 4.0<img style="height:22px!important;margin-left:3px;vertical-align:text-bottom;" src="https://mirrors.creativecommons.org/presskit/icons/cc.svg?ref=chooser-v1"><img style="height:22px!important;margin-left:3px;vertical-align:text-bottom;" src="https://mirrors.creativecommons.org/presskit/icons/by.svg?ref=chooser-v1"><img style="height:22px!important;margin-left:3px;vertical-align:text-bottom;" src="https://mirrors.creativecommons.org/presskit/icons/nc.svg?ref=chooser-v1"></a></p>'

theme = 'bienensteff'

[params]
description = 'Eine kleine Erkundung der Welt'
breadcrumb = false
blogAsHome = true
# Zielformat, in das der fig-Shortcode Bilder konvertiert
imageFormat = 'webp'
# GPS-Koordinaten (Exif/XMP) unter fig-Bildern anzeigen, verlinkt zu OpenStreetMap.
# Braucht den GPS-Ausschluss aus [imaging.meta].fields entfernt (siehe unten).
imageGeotags = true


[menus]
[[menus.main]]
name = 'Über uns'
pageRef = '/über-uns'
weight = 10

[[menus.main]]
name = '#tags'
pageRef = '/tags'
weight = 20

[[menus.footer]]
  name = 'Impressum'
  pageRef = '/impressum'
  weight = 10

[[menus.footer]]
  name = 'bienensteff.de'
  url = 'https://bienensteff.de'
  weight = 20

[privacy]
  [privacy.youtube]
    disable = false
    privacyEnhanced = true

[imaging]
  # Fallback-Qualitaet fuer Formate ohne eigenen Block (z. B. jpeg)
  quality = 92
  resampleFilter = "Lanczos"

  [imaging.webp]
    # Fuers Web praktisch verlustfrei wahrnehmbar, deutlich kleiner als 97
    quality = 85
    # 0-6, hoeher = bessere Kompression bei langsamerem Encode (einmalig, dank Cache)
    method = 6

  [imaging.meta]
    # Hugo-Default, aber ohne den GPS-Ausschluss: .Meta.Lat/.Long fuer den
    # fig-Geotag (imageGeotags). Aendern invalidiert den Bild-Cache.
    fields = ['! *{Exif,Exposure[MPB],Contrast,Resolution,Sharp,JPEG,Metering,Sensing,Saturation,ColorSpace,Flash,WhiteBalance}*']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.typographer]
        apostrophe = '&rsquo;'
        disable = false
        ellipsis = '&hellip;'
        emDash = '&mdash;'
        enDash = '&ndash;'
        leftAngleQuote = '&laquo;'
        leftDoubleQuote = '„'
        leftSingleQuote = '‚'
        rightAngleQuote = '&raquo;'
        rightDoubleQuote = '”'
        rightSingleQuote = '‘' 
