<nav class="article-nav d-flex flex-wrap justify-content-between gap-2" aria-label="Artikelnavigation">
    {{ with .PrevInSection }}
        <a class="btn btn-light" href="{{ .RelPermalink }}" rel="prev">« vorheriger Artikel</a>
    {{ else }}
        <span class="btn btn-light disabled" aria-disabled="true">« vorheriger Artikel</span>
    {{ end }}

    {{ with .NextInSection }}
        <a class="btn btn-light" href="{{ .RelPermalink }}" rel="next">nächster Artikel »</a>
    {{ else }}
        <span class="btn btn-light disabled" aria-disabled="true">nächster Artikel »</span>
    {{ end }}
</nav>
