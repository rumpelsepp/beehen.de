{{ define "main" }}
<article class="content">
  <header>
    <h1>{{ .Title }}</h1>
  </header>

  {{ with .Params.Description }}
      <p class="lead">
        {{ . }}
      </p>
  {{ end }}

  {{ .Content }}

  {{ partial "post-grid.html" (where site.RegularPages "Section" "blog") }}
</article>
{{ end }}
