{{ define "main" }}

<article class="content">
    <header>
        <div class="mb-4">
            {{ partial "article-nav.html" . }}
        </div>

        <hgroup>
            <h1 {{ if .Draft }}class="draft" {{ end }}>{{ $.Title }}</h1>

            <p class="text-secondary">{{ partial "subtitle.html" (dict "page" . "author" true) }}</p>
        </hgroup>
    </header>
    
    {{ partial "toc.html" . }}

    {{ .Content }}
    <footer>
        {{ partial "article-nav.html" . }}
    </footer>
</article>

{{ partial "related.html" . }}
{{ end }}
