{{ define "main" }}

<article class="content">
    <header>
        {{ partial "article-nav.html" . }}

        <hgroup>
            <h1 {{ if .Draft }}class="draft" {{ end }}>{{ $.Title }}</h1>

            <p class="text-body-secondary">
                {{ partial "subtitle.html" . }}
            </p>
        </hgroup>
    </header>

    {{ .Content }}
    <footer>
        {{ partial "article-nav.html" . }}
    </footer>
</article>

{{ partial "related.html" . }}
{{ end }}
