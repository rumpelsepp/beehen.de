name: hugo-deploy
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      # Images and videos live in Git LFS (~2 GB). Every download counts
      # against the LFS bandwidth quota, so keep the objects in the Actions
      # cache instead of checking out with `lfs: true`; only new ones are
      # fetched.
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-objects
      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-objects') }}
          restore-keys: |
            lfs-
      - name: Fetch LFS objects
        run: git lfs pull
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
      - name: Use Node.js
        uses: actions/setup-node@v6
      - name: Setup just
        uses: extractions/setup-just@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # vidpre.py is a PEP 723 script with no deps and no pyproject.toml —
          # nothing to cache, so skip the cache step and its "never invalidated"
          # warning.
          enable-cache: false
      - name: Setup ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
      - name: Cache Hugo image resources
        uses: actions/cache@v4
        with:
          path: resources/_gen
          key: hugo-resources-${{ github.run_id }}
          restore-keys: |
            hugo-resources-
      - name: Cache preprocessed videos
        uses: actions/cache@v4
        with:
          path: |
            content/**/*.mp4
            content/**/*.webm
            content/**/*-poster.jpg
            !content/**/*.raw.*
            !content/**/VID_*.mp4
          key: videos-${{ hashFiles('content/**/*.raw.*') }}
      - name: Build videos
        run: |
          # cache-restored outputs count as fresh: make raws the oldest so
          # vidpre.py only encodes what the cache is missing.
          find content -name '*.raw.*' -exec touch -d @0 {} + 2>/dev/null || true
          just preprocess-video
      - name: Install npm deps
        run: npm ci
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          if_key_exists: fail
      - name: Build and deploy
        run: just deploy
