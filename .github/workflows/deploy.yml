name: hugo-deploy
on:
  push:
    branches:
      - master
  workflow_dispatch:

# A newer push supersedes a deploy that is still running.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      # Images and videos live in Git LFS (~2 GB). Every download counts
      # against the LFS bandwidth quota, so keep the objects in the Actions
      # cache instead of checking out with `lfs: true`; only new ones are
      # fetched.
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-objects
      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-objects') }}
          restore-keys: |
            lfs-
      - name: Fetch LFS objects
        run: git lfs pull
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
      - name: Use Node.js
        uses: actions/setup-node@v6
      - name: Setup just
        uses: extractions/setup-just@v4
      # Resized images. The key covers everything that decides which variants
      # exist (source images, imaging config, templates), so a new cache is
      # only uploaded when that changes; otherwise the last one is reused.
      - name: Cache Hugo image resources
        uses: actions/cache@v4
        with:
          path: resources/_gen
          key: hugo-resources-${{ hashFiles('.lfs-objects', 'hugo.toml', 'layouts/**', 'themes/bienensteff/layouts/**') }}
          restore-keys: |
            hugo-resources-
      - name: Install npm deps
        run: npm ci
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          if_key_exists: fail
      - name: Build and deploy
        run: just deploy
