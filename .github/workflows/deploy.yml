name: hugo-deploy
on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
      - name: Use Node.js
        uses: actions/setup-node@v6
      - name: Setup just
        uses: extractions/setup-just@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Cache Hugo image resources
        uses: actions/cache@v4
        with:
          path: resources/_gen
          key: hugo-resources-${{ github.run_id }}
          restore-keys: |
            hugo-resources-
      - name: Cache preprocessed videos
        uses: actions/cache@v4
        with:
          path: |
            content/**/*.mp4
            content/**/*.webm
            content/**/*-poster.jpg
            !content/**/*.raw.*
            !content/**/VID_*.mp4
          key: videos-${{ hashFiles('content/**/*.raw.*') }}
      - name: Build videos
        run: |
          # cache-restored outputs count as fresh: make raws the oldest so
          # vidpre.py only encodes what the cache is missing.
          find content -name '*.raw.*' -exec touch -d @0 {} + 2>/dev/null || true
          just preprocess-video
      - name: Install npm deps
        run: npm ci
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          if_key_exists: fail
      - name: Build and deploy
        run: just deploy
